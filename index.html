<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PDF Tools</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- PDF-LIB -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    input[type="file"] {
      width: 100%;
      margin: 15px 0;
      padding: 10px;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .file-list {
      margin-top: 15px;
    }

    .file {
      background: #f1f5f9;
      padding: 10px;
      margin: 6px 0;
      border-radius: 7px;
      word-break: break-word;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }

    .note {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>📄 PDF Tools</h1>
  <p>Merge & Invert your PDF files</p>
</header>


<div class="container">

  <!-- PDF MERGER -->
  <div class="card">

    <h2>📚 Merge Multiple PDFs</h2>

    <p>Select two or more PDF files.</p>

    <input
      type="file"
      id="mergeFiles"
      accept="application/pdf"
      multiple
    >

    <div id="mergeFileList" class="file-list"></div>

    <button id="mergeBtn" disabled>
      Merge PDFs
    </button>

    <div id="mergeStatus" class="status"></div>

    <p class="note">
      The PDFs will be merged in the order shown above.
    </p>

  </div>


  <!-- COLOR INVERTER -->
  <div class="card">

    <h2>🔄 Invert PDF Colors</h2>

    <p>Select one PDF file to invert its colors.</p>

    <input
      type="file"
      id="invertFile"
      accept="application/pdf"
    >

    <button id="invertBtn" disabled>
      Invert Colors
    </button>

    <div id="invertStatus" class="status"></div>

    <p class="note">
      Your PDF is processed directly in your browser.
    </p>

  </div>

</div>


<footer>
  PDF Tools © 2026
</footer>


<script>

/* =========================================
   PDF MERGER
========================================= */

const mergeFiles = document.getElementById("mergeFiles");
const mergeFileList = document.getElementById("mergeFileList");
const mergeBtn = document.getElementById("mergeBtn");
const mergeStatus = document.getElementById("mergeStatus");

let selectedPDFs = [];


mergeFiles.addEventListener("change", function () {

  selectedPDFs = Array.from(this.files);

  mergeFileList.innerHTML = "";

  selectedPDFs.forEach((file, index) => {

    const div = document.createElement("div");

    div.className = "file";

    div.textContent =
      (index + 1) + ". " + file.name;

    mergeFileList.appendChild(div);

  });

  mergeBtn.disabled = selectedPDFs.length < 2;

});


mergeBtn.addEventListener("click", async function () {

  if (selectedPDFs.length < 2) {
    alert("Please select at least 2 PDF files.");
    return;
  }

  mergeBtn.disabled = true;

  mergeStatus.textContent =
    "⏳ Merging PDFs...";

  try {

    const mergedPdf =
      await PDFLib.PDFDocument.create();


    for (const file of selectedPDFs) {

      const data =
        await file.arrayBuffer();

      const pdf =
        await PDFLib.PDFDocument.load(data);

      const pages =
        await mergedPdf.copyPages(
          pdf,
          pdf.getPageIndices()
        );

      pages.forEach(page => {
        mergedPdf.addPage(page);
      });

    }


    const bytes =
      await mergedPdf.save();


    const blob =
      new Blob(
        [bytes],
        { type: "application/pdf" }
      );


    downloadFile(
      blob,
      "merged.pdf"
    );


    mergeStatus.textContent =
      "✅ PDFs merged successfully!";


  } catch (error) {

    console.error(error);

    mergeStatus.textContent =
      "❌ Could not merge the PDFs.";

  }


  mergeBtn.disabled = false;

});


/* =========================================
   PDF COLOR INVERTER
========================================= */

const invertFile =
  document.getElementById("invertFile");

const invertBtn =
  document.getElementById("invertBtn");

const invertStatus =
  document.getElementById("invertStatus");


let selectedInvertFile = null;


invertFile.addEventListener("change", function () {

  selectedInvertFile =
    this.files[0];

  invertBtn.disabled =
    !selectedInvertFile;

});


invertBtn.addEventListener("click", async function () {

  if (!selectedInvertFile) {
    return;
  }

  invertBtn.disabled = true;

  invertStatus.textContent =
    "⏳ Inverting PDF colors...";


  try {

    const arrayBuffer =
      await selectedInvertFile.arrayBuffer();


    const pdf =
      await pdfjsLib.getDocument({
        data: arrayBuffer
      }).promise;


    const {
      jsPDF
    } = window.jspdf;


    let outputPDF = null;


    for (let pageNumber = 1;
         pageNumber <= pdf.numPages;
         pageNumber++) {


      const page =
        await pdf.getPage(pageNumber);


      const viewport =
        page.getViewport({
          scale: 1.5
        });


      const canvas =
        document.createElement("canvas");


      const context =
        canvas.getContext("2d");


      canvas.width =
        viewport.width;

      canvas.height =
        viewport.height;


      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;


      /* Invert colors */

      const imageData =
        context.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );


      const pixels =
        imageData.data;


      for (let i = 0;
           i < pixels.length;
           i += 4) {

        pixels[i] =
          255 - pixels[i];

        pixels[i + 1] =
          255 - pixels[i + 1];

        pixels[i + 2] =
          255 - pixels[i + 2];

      }


      context.putImageData(
        imageData,
        0,
        0
      );


      const imgData =
        canvas.toDataURL("image/jpeg", 0.95);


      const orientation =
        viewport.width >
        viewport.height
          ? "landscape"
          : "portrait";


      if (!outputPDF) {

        outputPDF =
          new jsPDF({
            orientation: orientation,
            unit: "pt",
            format: [
              viewport.width,
              viewport.height
            ]
          });

      } else {

        outputPDF.addPage(
          [viewport.width, viewport.height],
          orientation
        );

      }


      outputPDF.addImage(
        imgData,
        "JPEG",
        0,
        0,
        viewport.width,
        viewport.height
      );

    }


    outputPDF.save(
      "inverted.pdf"
    );


    invertStatus.textContent =
      "✅ PDF color inverted successfully!";


  } catch (error) {

    console.error(error);

    invertStatus.textContent =
      "❌ Could not invert the PDF.";

  }


  invertBtn.disabled = false;

});


/* =========================================
   DOWNLOAD FUNCTION
========================================= */

function downloadFile(blob, filename) {

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;

  link.download = filename;

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 1000);

}

</script>

</body>
</html>
