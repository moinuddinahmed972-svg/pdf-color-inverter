<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PDF Color Inverter</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
          type="module"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      padding: 25px 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #d1d5db;
      margin-bottom: 30px;
    }

    .upload-box {
      background: rgba(255,255,255,0.1);
      border: 2px dashed #60a5fa;
      border-radius: 18px;
      padding: 45px 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    .upload-box:hover {
      background: rgba(255,255,255,0.16);
    }

    .upload-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .upload-box h2 {
      margin-bottom: 10px;
    }

    input[type="file"] {
      display: none;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 25px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .button:hover {
      background: #1d4ed8;
    }

    #status {
      margin: 20px 0;
      font-size: 16px;
      color: #bfdbfe;
    }

    #preview {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .page {
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    .page canvas {
      width: 100%;
      height: auto;
      display: block;
      filter: invert(1);
    }

    #downloadBtn {
      display: none;
      background: #16a34a;
      margin-bottom: 30px;
    }

    #downloadBtn:hover {
      background: #15803d;
    }

    .footer {
      margin-top: 40px;
      color: #9ca3af;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 27px;
      }

      .upload-box {
        padding: 35px 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📄 PDF Color Inverter</h1>

  <p class="subtitle">
    Upload your PDF and convert its colors to negative/inverted colors.
  </p>

  <label class="upload-box" for="pdfInput">

    <div class="upload-icon">📤</div>

    <h2>Upload PDF</h2>

    <p>Tap here to select your PDF file</p>

    <input
      type="file"
      id="pdfInput"
      accept="application/pdf"
    >

  </label>

  <div id="status"></div>

  <button id="downloadBtn" class="button">
    📥 Download Inverted PDF
  </button>

  <div id="preview"></div>

  <div class="footer">
    Your PDF is processed directly in your browser.
  </div>

</div>


<script type="module">

  import * as pdfjsLib from
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


  const fileInput = document.getElementById("pdfInput");
  const preview = document.getElementById("preview");
  const status = document.getElementById("status");
  const downloadBtn = document.getElementById("downloadBtn");

  let pdfDocument = null;


  fileInput.addEventListener("change", async function () {

    const file = this.files[0];

    if (!file) return;

    if (file.type !== "application/pdf") {
      status.textContent = "❌ Please select a PDF file.";
      return;
    }

    preview.innerHTML = "";
    downloadBtn.style.display = "none";

    status.textContent = "⏳ Processing PDF...";

    try {

      const arrayBuffer = await file.arrayBuffer();

      pdfDocument = await pdfjsLib.getDocument({
        data: arrayBuffer
      }).promise;

      status.textContent =
        `📄 ${pdfDocument.numPages} page(s) found.`;

      for (let pageNumber = 1;
           pageNumber <= pdfDocument.numPages;
           pageNumber++) {

        const page = await pdfDocument.getPage(pageNumber);

        const viewport = page.getViewport({
          scale: 1.5
        });

        const canvas = document.createElement("canvas");

        const context = canvas.getContext("2d");

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;

        const pageDiv = document.createElement("div");

        pageDiv.className = "page";

        pageDiv.appendChild(canvas);

        preview.appendChild(pageDiv);

      }

      status.textContent =
        "✅ PDF processed successfully!";

      downloadBtn.style.display = "inline-block";

    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ Something went wrong while processing the PDF.";

    }

  });


  downloadBtn.addEventListener("click", async function () {

    if (!pdfDocument) return;

    status.textContent =
      "⏳ Creating inverted PDF...";

    const { jsPDF } = window.jspdf;

    let pdfOutput = null;

    for (let pageNumber = 1;
         pageNumber <= pdfDocument.numPages;
         pageNumber++) {

      const page =
        await pdfDocument.getPage(pageNumber);

      const viewport =
        page.getViewport({ scale: 1.5 });

      const canvas =
        document.createElement("canvas");

      const context =
        canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;


      /* Invert colors */

      const imageData =
        context.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {

        data[i]     = 255 - data[i];
        data[i + 1] = 255 - data[i + 1];
        data[i + 2] = 255 - data[i + 2];

      }

      context.putImageData(
        imageData,
        0,
        0
      );


      const imgData =
        canvas.toDataURL("image/jpeg", 0.92);


      const orientation =
        viewport.width > viewport.height
          ? "landscape"
          : "portrait";


      const pageWidth =
        viewport.width / 1.5;

      const pageHeight =
        viewport.height / 1.5;


      if (pageNumber === 1) {

        pdfOutput = new jsPDF({
          orientation: orientation,
          unit: "pt",
          format: [pageWidth, pageHeight]
        });

      } else {

        pdfOutput.addPage(
          [pageWidth, pageHeight],
          orientation
        );

      }


      pdfOutput.addImage(
        imgData,
        "JPEG",
        0,
        0,
        pageWidth,
        pageHeight
      );

    }


    pdfOutput.save(
      "inverted-pdf.pdf"
    );

    status.textContent =
      "✅ Inverted PDF downloaded!";

  });

</script>

</body>
</html>
